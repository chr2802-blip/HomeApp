name: Tests

# Runs on every push and pull request. Vercel can be told to wait for this check
# before it deploys — see "Blocking a bad deploy" in the README.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homehub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite derives "homehub_test" from this and creates it on first run.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homehub
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/homehub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      # Two seconds, and it fails here rather than as a failed production build: a
      # schema edit with no migration to match runs `prisma migrate deploy` inside the
      # Vercel build, where there is no rollback.
      - name: Check migrations match the schema
        run: npm run db:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
